apiVersion: batch/v1
kind: Job
metadata:
  name: missing-resources
  namespace: rs-console
  annotations:
    rs.io/network-policy: enforced
spec:
  template:
    metadata:
      labels:
        app: missing-resources
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: example.invalid/app@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
