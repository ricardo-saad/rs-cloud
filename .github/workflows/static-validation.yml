name: Static validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned validators
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="${RUNNER_TEMP}/bin"
          mkdir -p "${GOBIN}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          go install github.com/open-policy-agent/conftest@v0.62.0
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          python3 -m pip install --disable-pip-version-check \
            --user yamllint==1.37.1
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Render and validate desired state
        env:
          VERIFY_UPSTREAM: "1"
        shell: bash
        run: ./scripts/validate.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e  # v1.73.0
        with:
          fail_level: any
          filter_mode: nofilter
          reporter: local

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.28.0"

  configuration-security:
    name: Trivy configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          cache: "false"
          exit-code: "1"
          format: table
          hide-progress: "true"
          scan-ref: .
          scan-type: config
          severity: HIGH,CRITICAL
          skip-dirs: policy/fixtures/deny
          version: v0.72.0
